[package]
name = "scanline_annotator"
version = "0.1.0"
edition = "2024"

[lib]
name = "scanline_annotator"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
ndarray = { version = "0.17", features = ["rayon"] }
numpy = "0.29.0"
pyo3 = { version = "0.29.0", features = ["abi3-py311", "extension-module"] }
rayon = "1.10.0"
thiserror = "2.0.12"

[dev-dependencies]
anyhow = "1.0.91"
approx = "0.5.1"
arbitrary = { version = "1.3.2", features = ["derive"] }
arbtest = "0.3.1"
float-cmp = "0.10.0"
ndarray = { version = "0.17", features = ["rayon", "serde"] }
serde = "1.0.200"
